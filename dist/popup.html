<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
</head>

<body style="min-width:350px">
    <h1>Latexicus</h1>

    <hr>
    <h3 style="font-size: 1.2rem; margin-bottom: 0px;">Caveats</h3>
    <ul>
        <li>sin 50 ❌</li>
        <li>sin(50) ✅</li>
    </ul>

    <hr>
    <h3>Settings</h3>
    <div class="settings">
        <div>
            <label for="remove-characters"><h4>Remove characters</h4><span>Strips certain characters from parts of equations.<br>Example: 5N*8kg -> 5*8</span></label>
            <input id="remove-characters" type="checkbox">
        </div>
        <div>
            <label for="hide-green-dot"><h4>Hide the green dot in the top left corner</h4></label>
            <input id="hide-green-dot" type="checkbox">
        </div>
        <div>
            <label style="width: 250px;" for="equals-strategy">
                <h4>Equals removal strategy</h4>
                <span>
                    Changes how the program handles the equals (=) sign in statements.
                </span>
            </label>
            <span>
                Current strategy of 
                <select id="equals-strategy">
                    <option selected value="left">Left side as input</option>
                    <option value="right">Right side as input</option>
                    <option value="longer">Longer side as input</option>
                </select>:<br>
                120*2=240
                <br>
                <b>Processed as: <span id="processed-result">120*2</span></b>
            </span>

        </div>
    </div>

    <hr>
    <h3>Submit feedback</h3>
    <p>Email me at latexicus@ctih1.fi to report any issues! :3</p>

    <hr>
    <h4 style="margin-bottom: 0px;">Special thanks to:</h4>
    <ul >
        <li><a href="https://github.com/escherpad/latex-parser">escherpad's latex-parser</a></li>
    </ul>

    <script src="popup.js"></script>
</body>


<style>
    ul {
        margin-top: 0px;
    }
    ul li {
        font-size: 1rem;
    }
    .settings div {
        display: flex;
        align-items: center;
        column-gap: 12px;
        margin-bottom: 12px;
    }
    .settings div label h4 {
        margin: 0px;
    }
    .settings div input[type="checkbox"] {
        scale: 1.5;
    }
</style>

</html>
