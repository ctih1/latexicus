<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
</head>

<body style="min-width:350px">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Latexicus</h1>

        <div>
            <label id="language_dropdown" for="lang-select"></label>
            <select id="lang-select">
                <option value="fi">Suomi</option>
                <option value="en">English</option>
            </select>
        </div>

    </div>

    <hr>
    <h3 id="caveats_header" style="margin-bottom: 0px;"></h3>
    <ul>
        <li id="caveat_beta"></li>
        <li id="caveat_tested"></li>
    </ul>

    <hr>
    <h3 id="settings_header"></h3>
    <div class="settings">
        <div>
            <label for="remove-characters"><h4 id="remove_char_settings_h"></h4><span id="remove_char_settings_d"></span></label>
            <input id="remove-characters" type="checkbox">
        </div>
        <div>
            <label for="hide-green-dot"><h4 id="green_dot_settings_h"></h4><span id="green_dot_settings_d"></span></label>
            <input id="hide-green-dot" type="checkbox">
        </div>
        <div>
            <label style="width: 250px;" for="equals-strategy">
                <h4 id="equals_remove_settings_h"></h4>
                <span id="equals_remove_settings_d">
                </span>
            </label>
            <span>
                <span id="equals_remove_settings_exp1"></span>
                <select id="equals-strategy">
                    <option id="equals_remove_settings_opt_l" selected value="left">Left side as input</option>
                    <option id="equals_remove_settings_opt_r" value="right">Right side as input</option>
                    <option id="equals_remove_settings_opt_longer" value="longer">Longer side as input</option>
                </select>:<br>
                120*2*3=240*2
                <br>
                <b><span id="equals_remove_settings_exp2"></span><span id="processed-result">120*2*3</span></b>
            </span>

        </div>
    </div>

    <hr>
    <h3 id="submit_feedback"></h3>
    <p id="support_email"></p>

    <hr>
    <h4 id="special_thanks" style="margin-bottom: 0px;"></h4>
    <ul >
        <li><a href="https://github.com/escherpad/latex-parser">escherpad's latex-parser</a></li>
    </ul>

    <script src="popup-bundle.js"></script>
</body>


<style>
    ul {
        margin-top: 0px;
    }

    h3 {
        font-size: 1.2rem; 
    }
    h4 {
        font-size: 0.9rem;
    }
    .settings div {
        display: flex;
        align-items: center;
        column-gap: 12px;
        margin-bottom: 12px;
        justify-content: space-between;
        margin-right: 24px;
    }
    .settings div label h4 {
        margin: 0px;
    }
    .settings div input[type="checkbox"] {
        scale: 1.5;
    }
</style>

</html>
